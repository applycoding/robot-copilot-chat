[project]
name = "robot-copilot-chat"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "httpx2==2.16.0",
  "jinja2==3.1.6",
  "sqlmodel==0.0.48",
  "shapely==2.2.0",
  "anthropic==2.1.0",
  "openai==3.39.0",
  "google-genai==2.33.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "playwright==1.64.1",
  "pytest-playwright==0.10.0",
  "ruff==0.17.2",
  "mypy==2.4.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "robot_copilot"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["PLAN.md", "docs/tutorial"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/repo/tutorial_goal_prose.py" = ["E501"]
"tests/repo/regenerate_tutorials.py" = ["E501"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not e2e' --import-mode=importlib"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:shapely",
]
markers = ["e2e: Playwright browser tests against a running server"]
