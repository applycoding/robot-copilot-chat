name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RCC_PROVIDER: mock

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
          GITHUB_TOKEN: ${{ github.token }}

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run --no-sync pytest --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: test-results/

  e2e:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync pytest -m e2e tests/e2e --browser chromium --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-test-results
          path: test-results/

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t rcc:ci .
      - run: docker run -d --name rcc -p 127.0.0.1:8000:8000 -v rcc-data:/app/data -e RCC_PROVIDER=mock rcc:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' rcc 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 1
          done
          docker logs rcc
          exit 1
      - run: curl -fsS http://127.0.0.1:8000/healthz | jq -e '.provider=="mock"'
      - run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/chat \
            -H 'content-type: application/json' \
            -d '{"message":"inspect the north fence"}' | jq -e '.mission.status=="valid"'
      - run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8000/healthz)
          test "$code" = "400"
      - run: |
          uid=$(docker exec rcc id -u)
          test "$uid" != "0"
          docker exec rcc test -s /app/data/rcc.db
      - run: docker logs rcc
        if: always()
      - run: docker rm -f rcc
        if: always()
